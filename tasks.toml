[tasks.deps]
cmds = ["go mod tidy"]

[tasks.build]
deps = [["deps"]]
cmds = ["go build -o dist/daylog ./main.go {{.CLI_ARGS}}"]

[tasks."build:demo"]
cmds = ["vhs demo/demo.tape"]

[tasks.run]
cmds = ["go run main.go {{.CLI_ARGS}}"]

[tasks.gofmt]
cmds = ["gofmt -l .", "test -z \"$(gofmt -l .)\""]

[tasks."gofmt:write"]
cmds = ["gofmt -w ."]

[tasks.vet]
cmds = ["go vet ./..."]

[tasks.test]
cmds = ["go test ./... -race"]

[tasks.release]
cmds = ["git tag {{.CLI_ARGS}}", "git push origin --tags"]

[tasks.release_dry]
desc = "goreleaser dry run"
cmds = ["goreleaser release --clean --skip publish --skip validate"]

[tasks."new:command"]
cmds = ["cobra-cli add {{.CLI_ARGS}}"]
